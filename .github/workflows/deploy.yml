name: CI-CD Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Github Openid Connect
      uses: aws-actions/configure-aws-credentials@v3
      with:
          role-to-assume: arn:aws:iam::948845146331:role/github-openid-connect
          aws-region: ap-south-1

    - name: Verify AWS identity
      run: aws sts get-caller-identity

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          sudo apt update -y
          

          # Install Docker if missing
          if ! command -v docker >/dev/null 2>&1; then
          sudo apt install -y docker.io 
          sudo apt install -y docker-compose
          sudo systemctl enable docker
          sudo systemctl start docker
          sudo usermod -aG docker ubuntu
          fi

          # Install Nginx if missing
          if ! command -v nginx >/dev/null 2>&1; then
            sudo apt-get install -y nginx
            sudo systemctl enable nginx
            sudo systemctl start nginx
          fi

          # Configure nginx reverse proxy
          sudo tee /etc/nginx/sites-available/default > /dev/null <<'EOF'
          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://127.0.0.1:5000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              }
          }
          EOF

          sudo nginx -t
          sudo systemctl restart nginx

          # Docker Hub login
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

          # Deploy container
          docker pull ${{ secrets.DOCKER_USERNAME }}/pythonapp:latest

          docker stop pythonapp || true
          docker rm pythonapp || true

          docker run -d \
            --name pythonapp \
            --restart always \
            -p 5000:5000 \
            ${{ secrets.DOCKER_USERNAME }}/pythonapp:latest
          
          # Deploy Monitoring
          if [ ! -d ~/ec2-docker-cicd ]; then
          git clone https://github.com/hsbangga7-oss/ec2-docker-cicd.git ~/ec2-docker-cicd
          else
          cd ec2-docker-cicd
          git pull origin main
          fi
         
          cd ec2-docker-cicd/monitoring
          sudo docker-compose pull || true
          sudo docker-compose up -d